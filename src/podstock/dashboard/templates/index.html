<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PodStock Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="assets/styles.css">
    <style>
        /* Custom color for recommendation cards */
        .bg-gray-750 { background-color: rgb(38, 42, 51); }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen" x-data="dashboard()">
    <!-- Navigation -->
    <nav class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-4">
                    <span class="text-xl font-bold text-emerald-400">PodStock</span>
                    <span class="text-gray-500">|</span>
                    <span class="text-sm text-gray-400" x-text="`${metadata.counts?.recommendations || 0} recommendations`"></span>
                </div>
                <div class="flex space-x-1">
                    <button @click="view = 'inbox'"
                            :class="view === 'inbox' ? 'bg-emerald-600' : 'bg-gray-700 hover:bg-gray-600'"
                            class="px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                        Inbox
                    </button>
                    <button @click="view = 'podcast'"
                            :class="view === 'podcast' ? 'bg-emerald-600' : 'bg-gray-700 hover:bg-gray-600'"
                            class="px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                        Podcast
                    </button>
                    <button @click="view = 'twitter'"
                            :class="view === 'twitter' ? 'bg-emerald-600' : 'bg-gray-700 hover:bg-gray-600'"
                            class="px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                        Twitter
                    </button>
                    <button @click="view = 'youtube'"
                            :class="view === 'youtube' ? 'bg-emerald-600' : 'bg-gray-700 hover:bg-gray-600'"
                            class="px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                        YouTube
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Loading State -->
        <div x-show="loading" class="flex items-center justify-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-400"></div>
        </div>

        <!-- Inbox View -->
        <div x-show="view === 'inbox' && !loading" x-cloak>
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-2xl font-bold">Inbox</h1>
                <span class="text-sm text-gray-400" x-text="filteredInbox.length + ' rekommendationer'"></span>
            </div>

            <!-- Filter Panel -->
            <div class="bg-gray-800 rounded-lg p-4 mb-6 border border-gray-700">
                <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
                    <!-- Date Filter -->
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Datum</label>
                        <select x-model="inboxFilters.dateRange" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm">
                            <option value="">Alla</option>
                            <option value="7d">Senaste 7 dagar</option>
                            <option value="30d">Senaste 30 dagar</option>
                            <option value="90d">Senaste 90 dagar</option>
                            <option value="365d">Senaste året</option>
                        </select>
                    </div>

                    <!-- Action Filter -->
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Action</label>
                        <select x-model="inboxFilters.action" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm">
                            <option value="">Alla</option>
                            <option value="buy">Buy</option>
                            <option value="sell">Sell</option>
                            <option value="hold">Hold</option>
                            <option value="watch">Watch</option>
                            <option value="avoid">Avoid</option>
                        </select>
                    </div>

                    <!-- Confidence Filter -->
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Confidence</label>
                        <select x-model="inboxFilters.confidence" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm">
                            <option value="">Alla</option>
                            <option value="high">High</option>
                            <option value="medium">Medium</option>
                            <option value="low">Low</option>
                        </select>
                    </div>

                    <!-- Trust Filter -->
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Trust-nivå</label>
                        <select x-model="inboxFilters.minTrust" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm">
                            <option value="0">Alla</option>
                            <option value="3">★★★ och uppåt</option>
                            <option value="4">★★★★ och uppåt</option>
                            <option value="5">★★★★★ endast</option>
                        </select>
                    </div>

                    <!-- Source Filter -->
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Källa</label>
                        <select x-model="inboxFilters.source" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm">
                            <option value="">Alla källor</option>
                            <template x-for="source in sources" :key="source.id">
                                <option :value="source.id" x-text="source.name"></option>
                            </template>
                        </select>
                    </div>

                    <!-- Search -->
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Sök</label>
                        <input type="text" x-model="inboxFilters.search" placeholder="Bolagsnamn..."
                               class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <!-- Quick Filters -->
                <div class="flex gap-2 mt-4 pt-4 border-t border-gray-700">
                    <button @click="inboxFilters = { dateRange: '30d', action: 'buy', confidence: 'high', minTrust: '4', source: '', search: '' }"
                            class="px-3 py-1 rounded-lg text-xs bg-emerald-900 text-emerald-300 hover:bg-emerald-800 transition-colors">
                        High Conviction
                    </button>
                    <button @click="inboxFilters = { dateRange: '7d', action: '', confidence: '', minTrust: '0', source: '', search: '' }"
                            class="px-3 py-1 rounded-lg text-xs bg-gray-700 text-gray-300 hover:bg-gray-600 transition-colors">
                        Senaste veckan
                    </button>
                    <button @click="inboxFilters = { dateRange: '', action: '', confidence: '', minTrust: '0', source: '', search: '' }"
                            class="px-3 py-1 rounded-lg text-xs bg-gray-700 text-gray-300 hover:bg-gray-600 transition-colors">
                        Rensa filter
                    </button>
                </div>
            </div>

            <!-- Recommendations List -->
            <div class="space-y-3">
                <template x-for="rec in filteredInbox.slice(0, inboxDisplayLimit)" :key="rec.id">
                    <div class="bg-gray-800 rounded-lg p-4 border border-gray-700 transition-all"
                         :class="(rec.trust_rating || rec.source_trust || 3) < 3 ? 'opacity-60' : ''">
                        <div class="flex items-start justify-between">
                            <div class="flex items-center space-x-3">
                                <!-- Action Badge -->
                                <span class="px-3 py-1 rounded-full text-sm font-medium"
                                      :class="{
                                          'bg-green-900 text-green-300': rec.action === 'buy',
                                          'bg-red-900 text-red-300': rec.action === 'sell' || rec.action === 'avoid',
                                          'bg-yellow-900 text-yellow-300': rec.action === 'hold',
                                          'bg-blue-900 text-blue-300': rec.action === 'watch'
                                      }"
                                      x-text="rec.action ? rec.action.toUpperCase() : '-'">
                                </span>
                                <div>
                                    <span class="font-semibold text-lg" x-text="rec.stock_name"></span>
                                    <span x-show="rec.ticker" class="text-gray-500 text-sm ml-1" x-text="rec.ticker"></span>
                                    <span x-show="rec.confidence" class="ml-2 px-2 py-0.5 rounded text-xs"
                                          :class="{
                                              'bg-emerald-900 text-emerald-300': rec.confidence === 'high',
                                              'bg-yellow-900 text-yellow-300': rec.confidence === 'medium',
                                              'bg-gray-700 text-gray-400': rec.confidence === 'low'
                                          }"
                                          x-text="rec.confidence">
                                    </span>
                                </div>
                            </div>
                            <div class="flex items-center space-x-3">
                                <!-- Trust Stars -->
                                <div class="flex items-center">
                                    <template x-for="i in 5">
                                        <span :class="i <= (rec.trust_rating || rec.source_trust || 3) ? 'text-yellow-400' : 'text-gray-600'" class="text-sm">★</span>
                                    </template>
                                </div>
                                <span class="text-gray-400 text-sm" x-text="rec.date"></span>
                            </div>
                        </div>
                        <div class="mt-2 text-sm text-gray-400">
                            <span x-text="rec.source_name"></span>
                            <template x-if="rec.speaker">
                                <span> · <span x-text="rec.speaker"></span></span>
                            </template>
                        </div>
                        <p x-show="rec.reasoning" class="mt-2 text-sm text-gray-300" x-text="rec.reasoning"></p>
                        <p x-show="rec.quote" class="mt-2 text-sm text-gray-500 italic" x-text="rec.quote"></p>
                    </div>
                </template>
            </div>

            <!-- Load More -->
            <button x-show="filteredInbox.length > inboxDisplayLimit"
                    @click="inboxDisplayLimit += 50"
                    class="mt-6 w-full py-3 bg-gray-800 hover:bg-gray-700 rounded-lg text-sm transition-colors">
                Visa fler (<span x-text="filteredInbox.length - inboxDisplayLimit"></span> kvar)
            </button>

            <p x-show="filteredInbox.length === 0" class="text-gray-500 text-center py-10">
                Inga rekommendationer matchar filtren
            </p>
        </div>

        <!-- Podcast View -->
        <div x-show="view === 'podcast' && !loading" x-cloak>
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-2xl font-bold">Podcast</h1>
                <span class="text-sm text-gray-400" x-text="filteredPodcastEpisodes.length + ' avsnitt'"></span>
            </div>

            <!-- Filter Panel -->
            <div class="bg-gray-800 rounded-lg p-4 mb-6 border border-gray-700">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <!-- Podcast dropdown -->
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Podcast</label>
                        <select x-model="podcastFilters.source" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm">
                            <option value="">Alla podcasts</option>
                            <template x-for="src in podcastSources" :key="src.id">
                                <option :value="src.id" x-text="src.name + ' (' + src.episode_count + ')'"></option>
                            </template>
                        </select>
                    </div>

                    <!-- Date From -->
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Från datum</label>
                        <input type="date" x-model="podcastFilters.dateFrom"
                               class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm">
                    </div>

                    <!-- Date To -->
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Till datum</label>
                        <input type="date" x-model="podcastFilters.dateTo"
                               class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm">
                    </div>

                    <!-- Company Search -->
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Sök bolag</label>
                        <input type="text" x-model="podcastFilters.companySearch" placeholder="Bolagsnamn..."
                               class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <!-- Clear filters -->
                <div class="flex gap-2 mt-4 pt-4 border-t border-gray-700">
                    <button @click="podcastFilters = { source: '', dateFrom: '', dateTo: '', companySearch: '' }"
                            class="px-3 py-1 rounded-lg text-xs bg-gray-700 text-gray-300 hover:bg-gray-600 transition-colors">
                        Rensa filter
                    </button>
                </div>
            </div>

            <!-- Episode List -->
            <div class="space-y-3">
                <template x-for="episode in filteredPodcastEpisodes.slice(0, podcastDisplayLimit)" :key="episode.id">
                    <div class="bg-gray-800 rounded-lg p-4 border border-gray-700">
                        <div class="flex items-start justify-between">
                            <div class="flex-1">
                                <div class="flex items-center space-x-2 flex-wrap">
                                    <span class="text-sm text-emerald-400 font-medium" x-text="episode.podcast_name"></span>
                                    <span class="text-gray-500">|</span>
                                    <span class="text-gray-400 text-sm" x-text="episode.date"></span>
                                    <span x-show="episode.episode_number" class="text-gray-500 text-xs" x-text="'#' + episode.episode_number"></span>
                                </div>
                                <h3 class="font-semibold text-lg mt-1" x-text="episode.episode_title"></h3>
                                <div x-show="(episode.hosts || []).length || (episode.guests || []).length" class="text-sm text-gray-500 mt-1">
                                    <span x-show="(episode.hosts || []).length" x-text="'Hosts: ' + (episode.hosts || []).join(', ')"></span>
                                    <span x-show="(episode.guests || []).length" x-text="' | Gäster: ' + (episode.guests || []).join(', ')"></span>
                                </div>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span x-show="episode.recommendation_count > 0" class="px-2 py-1 rounded text-xs bg-emerald-900 text-emerald-300"
                                      x-text="episode.recommendation_count + ' rec'"></span>
                                <span x-show="episode.market_sentiment" class="px-2 py-1 rounded text-xs"
                                      :class="{
                                          'bg-green-900 text-green-300': episode.market_sentiment === 'bullish',
                                          'bg-red-900 text-red-300': episode.market_sentiment === 'bearish',
                                          'bg-gray-700 text-gray-300': episode.market_sentiment === 'neutral' || episode.market_sentiment === 'mixed'
                                      }"
                                      x-text="episode.market_sentiment"></span>
                            </div>
                        </div>

                        <p x-show="episode.summary" class="mt-3 text-sm text-gray-300" x-text="episode.summary"></p>

                        <!-- Key Takeaways -->
                        <div x-show="episode.key_takeaways.length > 0" class="mt-3">
                            <div class="flex flex-wrap gap-1">
                                <template x-for="(takeaway, i) in episode.key_takeaways.slice(0, 4)" :key="i">
                                    <span class="px-2 py-0.5 bg-gray-700 rounded text-xs text-gray-300" x-text="takeaway"></span>
                                </template>
                            </div>
                        </div>

                        <!-- Recommendations (expandable) -->
                        <div x-show="episode.recommendations.length > 0" class="mt-3 pt-3 border-t border-gray-700">
                            <div class="space-y-2">
                                <template x-for="(rec, recIndex) in episode.recommendations" :key="rec.stock_name + '-' + recIndex">
                                    <div class="rounded-lg bg-gray-750 border border-gray-600 overflow-hidden">
                                        <!-- Recommendation Header (clickable) -->
                                        <div class="flex items-center justify-between px-3 py-2 cursor-pointer hover:bg-gray-700 transition-colors"
                                             @click="rec.expanded = !rec.expanded">
                                            <div class="flex items-center space-x-2">
                                                <span class="px-2 py-0.5 rounded text-xs font-semibold"
                                                      :class="{
                                                          'bg-green-900 text-green-300': rec.action === 'buy',
                                                          'bg-red-900 text-red-300': rec.action === 'sell' || rec.action === 'avoid',
                                                          'bg-yellow-900 text-yellow-300': rec.action === 'hold',
                                                          'bg-blue-900 text-blue-300': rec.action === 'watch'
                                                      }"
                                                      x-text="rec.action?.toUpperCase()"></span>
                                                <span class="font-medium text-gray-100" x-text="rec.stock_name"></span>
                                                <span x-show="rec.ticker" class="text-sm text-gray-500" x-text="'(' + rec.ticker + ')'"></span>
                                            </div>
                                            <div class="flex items-center space-x-3">
                                                <!-- Price change indicator (if available) -->
                                                <span x-show="rec.price_change_pct !== undefined && rec.price_change_pct !== null"
                                                      class="text-xs font-medium px-2 py-0.5 rounded"
                                                      :class="rec.price_change_pct >= 0 ? 'bg-green-900/50 text-green-400' : 'bg-red-900/50 text-red-400'"
                                                      x-text="(rec.price_change_pct >= 0 ? '+' : '') + rec.price_change_pct?.toFixed(1) + '%'"></span>
                                                <!-- Confidence badge -->
                                                <span x-show="rec.confidence" class="text-xs px-2 py-0.5 rounded"
                                                      :class="{
                                                          'bg-emerald-900/50 text-emerald-400': rec.confidence === 'high',
                                                          'bg-yellow-900/50 text-yellow-400': rec.confidence === 'medium',
                                                          'bg-gray-700 text-gray-400': rec.confidence === 'low' || rec.confidence === 'speculative'
                                                      }"
                                                      x-text="rec.confidence"></span>
                                                <!-- Expand icon -->
                                                <svg class="w-4 h-4 text-gray-500 transition-transform" :class="rec.expanded ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                                </svg>
                                            </div>
                                        </div>
                                        <!-- Recommendation Details (expandable) -->
                                        <div x-show="rec.expanded" x-collapse class="px-3 pb-3 pt-1 border-t border-gray-700 bg-gray-800/50">
                                            <!-- Price info -->
                                            <div x-show="rec.price_at_signal || rec.latest_price" class="flex items-center space-x-2 text-sm text-gray-400 mb-2">
                                                <span>📊</span>
                                                <span x-show="rec.price_at_signal" x-text="'Pris vid signal: ' + rec.price_at_signal + ' SEK'"></span>
                                                <span x-show="rec.price_at_signal && rec.latest_price">→</span>
                                                <span x-show="rec.latest_price" x-text="rec.latest_price + ' SEK'"></span>
                                            </div>
                                            <!-- Speaker info -->
                                            <div x-show="rec.speaker" class="text-sm text-gray-400 mb-2">
                                                <span>🗣️</span>
                                                <span x-text="rec.speaker"></span>
                                                <span x-show="rec.speaker_role" class="text-gray-500" x-text="'(' + rec.speaker_role + ')'"></span>
                                            </div>
                                            <!-- Reasoning -->
                                            <div x-show="rec.reasoning" class="mb-2">
                                                <div class="text-xs text-gray-500 mb-1">Motivering:</div>
                                                <p class="text-sm text-gray-300" x-text="rec.reasoning"></p>
                                            </div>
                                            <!-- Quote -->
                                            <div x-show="rec.quote" class="mb-2">
                                                <div class="text-xs text-gray-500 mb-1">Citat:</div>
                                                <p class="text-sm text-gray-400 italic border-l-2 border-gray-600 pl-3" x-text="rec.quote"></p>
                                            </div>
                                            <!-- Price target & time horizon -->
                                            <div x-show="rec.price_target || rec.time_horizon" class="flex space-x-4 text-sm text-gray-400">
                                                <span x-show="rec.price_target" x-text="'🎯 Kursmål: ' + rec.price_target"></span>
                                                <span x-show="rec.time_horizon" x-text="'⏱️ Tidshorisont: ' + rec.time_horizon"></span>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- Stocks Discussed -->
                        <div x-show="episode.stocks_discussed.length > 0 && episode.recommendations.length === 0" class="mt-3 pt-3 border-t border-gray-700">
                            <span class="text-xs text-gray-500">Bolag diskuterade: </span>
                            <span class="text-xs text-gray-400" x-text="episode.stocks_discussed.slice(0, 10).join(', ')"></span>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Load More -->
            <button x-show="filteredPodcastEpisodes.length > podcastDisplayLimit"
                    @click="podcastDisplayLimit += 50"
                    class="mt-6 w-full py-3 bg-gray-800 hover:bg-gray-700 rounded-lg text-sm transition-colors">
                Visa fler (<span x-text="filteredPodcastEpisodes.length - podcastDisplayLimit"></span> kvar)
            </button>

            <p x-show="filteredPodcastEpisodes.length === 0" class="text-gray-500 text-center py-10">
                Inga avsnitt matchar filtren
            </p>
        </div>

        <!-- Twitter View -->
        <div x-show="view === 'twitter' && !loading" x-cloak>
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-2xl font-bold">Twitter</h1>
                <span class="text-sm text-gray-400" x-text="filteredTweets.length + ' tweets'"></span>
            </div>

            <!-- Filter Panel -->
            <div class="bg-gray-800 rounded-lg p-4 mb-6 border border-gray-700">
                <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                    <!-- User dropdown -->
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Användare</label>
                        <select x-model="twitterFilters.user" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm">
                            <option value="">Alla användare</option>
                            <template x-for="user in twitterUsers" :key="user.id">
                                <option :value="user.id" x-text="user.handle + ' (' + user.actionable_count + ' actionable)'"></option>
                            </template>
                        </select>
                    </div>

                    <!-- Date From -->
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Från datum</label>
                        <input type="date" x-model="twitterFilters.dateFrom"
                               class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm">
                    </div>

                    <!-- Date To -->
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Till datum</label>
                        <input type="date" x-model="twitterFilters.dateTo"
                               class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm">
                    </div>

                    <!-- Company Search -->
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Sök bolag</label>
                        <input type="text" x-model="twitterFilters.companySearch" placeholder="Bolagsnamn..."
                               class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                    </div>

                    <!-- Only Actionable -->
                    <div class="flex items-end pb-2">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" x-model="twitterFilters.onlyActionable"
                                   class="w-4 h-4 rounded border-gray-600 bg-gray-700 text-emerald-500 focus:ring-emerald-500">
                            <span class="text-sm text-gray-300">Endast actionable</span>
                        </label>
                    </div>
                </div>

                <!-- Clear filters -->
                <div class="flex gap-2 mt-4 pt-4 border-t border-gray-700">
                    <button @click="twitterFilters = { user: '', dateFrom: '', dateTo: '', companySearch: '', onlyActionable: false }"
                            class="px-3 py-1 rounded-lg text-xs bg-gray-700 text-gray-300 hover:bg-gray-600 transition-colors">
                        Rensa filter
                    </button>
                    <button @click="twitterFilters.onlyActionable = true"
                            class="px-3 py-1 rounded-lg text-xs bg-emerald-900 text-emerald-300 hover:bg-emerald-800 transition-colors">
                        Visa endast actionable
                    </button>
                </div>
            </div>

            <!-- Cross-reference section (when searching for company) -->
            <div x-show="twitterFilters.companySearch && crossReferencedStocks.length > 0" class="mb-6">
                <h2 class="text-lg font-semibold mb-3">Bolag nämnda av flera användare</h2>
                <div class="grid gap-3">
                    <template x-for="stock in crossReferencedStocks.slice(0, 10)" :key="stock.stock_name">
                        <div class="bg-gray-800 rounded-lg p-3 border border-emerald-700">
                            <div class="flex items-center justify-between">
                                <div>
                                    <span class="font-medium text-emerald-400" x-text="stock.stock_name"></span>
                                    <span x-show="stock.ticker" class="text-gray-500 text-sm ml-1" x-text="'(' + stock.ticker + ')'"></span>
                                </div>
                                <span class="text-sm text-gray-400" x-text="stock.total_mentions + ' mentions'"></span>
                            </div>
                            <div class="mt-2 flex flex-wrap gap-1">
                                <template x-for="um in stock.user_mentions" :key="um.user_id">
                                    <span class="px-2 py-0.5 bg-gray-700 rounded text-xs text-gray-300"
                                          x-text="'@' + um.user_id + ' (' + um.count + ')'"></span>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Tweet List -->
            <div class="space-y-3">
                <template x-for="(tweet, tweetIndex) in filteredTweets.slice(0, twitterDisplayLimit)" :key="tweet.user_id + '-' + tweet.id + '-' + tweetIndex">
                    <div class="bg-gray-800 rounded-lg p-4 border border-gray-700"
                         :class="tweet.is_actionable ? 'border-l-2 border-l-emerald-500' : ''">
                        <div class="flex items-start justify-between">
                            <div class="flex items-center space-x-2">
                                <span class="font-medium text-emerald-400" x-text="tweet.user_handle"></span>
                                <span class="text-gray-500 text-sm" x-text="tweet.date"></span>
                                <span x-show="tweet.is_reply" class="text-xs text-gray-600">reply</span>
                            </div>
                            <div class="flex items-center space-x-3 text-sm text-gray-500">
                                <span x-show="tweet.likes" x-text="tweet.likes + ' ♥'"></span>
                                <span x-show="tweet.views" x-text="tweet.views + ' views'"></span>
                            </div>
                        </div>

                        <p class="mt-2 text-gray-200 whitespace-pre-wrap" x-text="tweet.text"></p>

                        <!-- Stock mentions (expandable) -->
                        <div x-show="tweet.stock_mentions.length > 0" class="mt-3 space-y-2">
                            <template x-for="(mention, mentionIndex) in tweet.stock_mentions" :key="tweet.id + '-mention-' + mentionIndex">
                                <div class="rounded-lg bg-gray-750 border border-gray-600 overflow-hidden">
                                    <!-- Mention Header (clickable) -->
                                    <div class="flex items-center justify-between px-3 py-2 cursor-pointer hover:bg-gray-700 transition-colors"
                                         @click="mention.expanded = !mention.expanded">
                                        <div class="flex items-center space-x-2">
                                            <span class="px-2 py-0.5 rounded text-xs font-semibold"
                                                  :class="{
                                                      'bg-green-900 text-green-300': mention.action === 'buy',
                                                      'bg-red-900 text-red-300': mention.action === 'sell' || mention.action === 'avoid',
                                                      'bg-yellow-900 text-yellow-300': mention.action === 'hold',
                                                      'bg-blue-900 text-blue-300': mention.action === 'watch',
                                                      'bg-gray-700 text-gray-300': !mention.action || mention.action === 'unknown'
                                                  }"
                                                  x-text="mention.action?.toUpperCase() || 'MENTION'"></span>
                                            <span class="font-medium text-gray-100" x-text="mention.stock_name"></span>
                                            <span x-show="mention.ticker" class="text-sm text-gray-500" x-text="'$' + mention.ticker"></span>
                                        </div>
                                        <div class="flex items-center space-x-3">
                                            <!-- Price change indicator -->
                                            <span x-show="mention.price_change_pct !== undefined && mention.price_change_pct !== null"
                                                  class="text-xs font-medium px-2 py-0.5 rounded"
                                                  :class="mention.price_change_pct >= 0 ? 'bg-green-900/50 text-green-400' : 'bg-red-900/50 text-red-400'"
                                                  x-text="(mention.price_change_pct >= 0 ? '+' : '') + mention.price_change_pct?.toFixed(1) + '%'"></span>
                                            <!-- Confidence badge -->
                                            <span x-show="mention.confidence" class="text-xs px-2 py-0.5 rounded"
                                                  :class="{
                                                      'bg-emerald-900/50 text-emerald-400': mention.confidence === 'high',
                                                      'bg-yellow-900/50 text-yellow-400': mention.confidence === 'medium',
                                                      'bg-gray-700 text-gray-400': mention.confidence === 'low'
                                                  }"
                                                  x-text="mention.confidence"></span>
                                            <!-- Expand icon -->
                                            <svg class="w-4 h-4 text-gray-500 transition-transform" :class="mention.expanded ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                            </svg>
                                        </div>
                                    </div>
                                    <!-- Mention Details (expandable) -->
                                    <div x-show="mention.expanded" x-collapse class="px-3 pb-3 pt-1 border-t border-gray-700 bg-gray-800/50">
                                        <!-- Price info -->
                                        <div x-show="mention.price_at_signal || mention.latest_price" class="flex items-center space-x-2 text-sm text-gray-400 mb-2">
                                            <span>📊</span>
                                            <span x-show="mention.price_at_signal" x-text="'Pris vid signal: ' + mention.price_at_signal + ' SEK'"></span>
                                            <span x-show="mention.price_at_signal && mention.latest_price">→</span>
                                            <span x-show="mention.latest_price" x-text="mention.latest_price + ' SEK'"></span>
                                        </div>
                                        <!-- Reasoning -->
                                        <div x-show="mention.reasoning" class="mb-2">
                                            <div class="text-xs text-gray-500 mb-1">Motivering:</div>
                                            <p class="text-sm text-gray-300" x-text="mention.reasoning"></p>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Load More -->
            <button x-show="filteredTweets.length > twitterDisplayLimit"
                    @click="twitterDisplayLimit += 100"
                    class="mt-6 w-full py-3 bg-gray-800 hover:bg-gray-700 rounded-lg text-sm transition-colors">
                Visa fler (<span x-text="filteredTweets.length - twitterDisplayLimit"></span> kvar)
            </button>

            <p x-show="filteredTweets.length === 0" class="text-gray-500 text-center py-10">
                Inga tweets matchar filtren
            </p>
        </div>

        <!-- YouTube View -->
        <div x-show="view === 'youtube' && !loading" x-cloak>
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-2xl font-bold">YouTube</h1>
                <span class="text-sm text-gray-400" x-text="filteredYoutubeVideos.length + ' videor'"></span>
            </div>

            <!-- Filter Panel -->
            <div class="bg-gray-800 rounded-lg p-4 mb-6 border border-gray-700">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <!-- Channel dropdown -->
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Kanal</label>
                        <select x-model="youtubeFilters.channel" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm">
                            <option value="">Alla kanaler</option>
                            <template x-for="channel in youtubeChannels" :key="channel.id">
                                <option :value="channel.id" x-text="channel.name + ' (' + channel.video_count + ')'"></option>
                            </template>
                        </select>
                    </div>

                    <!-- Date From -->
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Från datum</label>
                        <input type="date" x-model="youtubeFilters.dateFrom"
                               class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm">
                    </div>

                    <!-- Date To -->
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Till datum</label>
                        <input type="date" x-model="youtubeFilters.dateTo"
                               class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm">
                    </div>

                    <!-- Company Search -->
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Sök bolag</label>
                        <input type="text" x-model="youtubeFilters.companySearch" placeholder="Bolagsnamn..."
                               class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <!-- Clear filters -->
                <div class="flex gap-2 mt-4 pt-4 border-t border-gray-700">
                    <button @click="youtubeFilters = { channel: '', dateFrom: '', dateTo: '', companySearch: '' }"
                            class="px-3 py-1 rounded-lg text-xs bg-gray-700 text-gray-300 hover:bg-gray-600 transition-colors">
                        Rensa filter
                    </button>
                </div>
            </div>

            <!-- Video List -->
            <div class="space-y-3">
                <template x-for="video in filteredYoutubeVideos.slice(0, youtubeDisplayLimit)" :key="video.id">
                    <div class="bg-gray-800 rounded-lg p-4 border border-gray-700">
                        <div class="flex items-start justify-between">
                            <div class="flex-1">
                                <div class="flex items-center space-x-2">
                                    <span class="text-sm text-red-400 font-medium" x-text="video.channel_name"></span>
                                    <span class="text-gray-500">|</span>
                                    <span class="text-gray-400 text-sm" x-text="video.date"></span>
                                    <span x-show="video.category" class="px-2 py-0.5 rounded text-xs bg-gray-700 text-gray-400" x-text="video.category"></span>
                                </div>
                                <h3 class="font-semibold text-lg mt-1" x-text="video.title"></h3>
                            </div>
                            <span x-show="video.recommendation_count > 0" class="px-2 py-1 rounded text-xs bg-emerald-900 text-emerald-300"
                                  x-text="video.recommendation_count + ' rec'"></span>
                        </div>

                        <p x-show="video.summary" class="mt-3 text-sm text-gray-300" x-text="video.summary"></p>

                        <!-- Recommendations (expandable) -->
                        <div x-show="video.recommendations.length > 0" class="mt-3 pt-3 border-t border-gray-700">
                            <div class="space-y-2">
                                <template x-for="(rec, recIndex) in video.recommendations" :key="rec.stock_name + '-' + recIndex">
                                    <div class="rounded-lg bg-gray-750 border border-gray-600 overflow-hidden">
                                        <!-- Recommendation Header (clickable) -->
                                        <div class="flex items-center justify-between px-3 py-2 cursor-pointer hover:bg-gray-700 transition-colors"
                                             @click="rec.expanded = !rec.expanded">
                                            <div class="flex items-center space-x-2">
                                                <span class="px-2 py-0.5 rounded text-xs font-semibold"
                                                      :class="{
                                                          'bg-green-900 text-green-300': rec.action === 'buy',
                                                          'bg-red-900 text-red-300': rec.action === 'sell' || rec.action === 'avoid',
                                                          'bg-yellow-900 text-yellow-300': rec.action === 'hold',
                                                          'bg-blue-900 text-blue-300': rec.action === 'watch'
                                                      }"
                                                      x-text="rec.action?.toUpperCase()"></span>
                                                <span class="font-medium text-gray-100" x-text="rec.stock_name"></span>
                                                <span x-show="rec.ticker" class="text-sm text-gray-500" x-text="'(' + rec.ticker + ')'"></span>
                                            </div>
                                            <div class="flex items-center space-x-3">
                                                <!-- Price change indicator -->
                                                <span x-show="rec.price_change_pct !== undefined && rec.price_change_pct !== null"
                                                      class="text-xs font-medium px-2 py-0.5 rounded"
                                                      :class="rec.price_change_pct >= 0 ? 'bg-green-900/50 text-green-400' : 'bg-red-900/50 text-red-400'"
                                                      x-text="(rec.price_change_pct >= 0 ? '+' : '') + rec.price_change_pct?.toFixed(1) + '%'"></span>
                                                <!-- Confidence badge -->
                                                <span x-show="rec.confidence" class="text-xs px-2 py-0.5 rounded"
                                                      :class="{
                                                          'bg-emerald-900/50 text-emerald-400': rec.confidence === 'high',
                                                          'bg-yellow-900/50 text-yellow-400': rec.confidence === 'medium',
                                                          'bg-gray-700 text-gray-400': rec.confidence === 'low' || rec.confidence === 'speculative'
                                                      }"
                                                      x-text="rec.confidence"></span>
                                                <!-- Expand icon -->
                                                <svg class="w-4 h-4 text-gray-500 transition-transform" :class="rec.expanded ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                                </svg>
                                            </div>
                                        </div>
                                        <!-- Recommendation Details (expandable) -->
                                        <div x-show="rec.expanded" x-collapse class="px-3 pb-3 pt-1 border-t border-gray-700 bg-gray-800/50">
                                            <!-- Price info -->
                                            <div x-show="rec.price_at_signal || rec.latest_price" class="flex items-center space-x-2 text-sm text-gray-400 mb-2">
                                                <span>📊</span>
                                                <span x-show="rec.price_at_signal" x-text="'Pris vid signal: ' + rec.price_at_signal + ' SEK'"></span>
                                                <span x-show="rec.price_at_signal && rec.latest_price">→</span>
                                                <span x-show="rec.latest_price" x-text="rec.latest_price + ' SEK'"></span>
                                            </div>
                                            <!-- Speaker info -->
                                            <div x-show="rec.speaker" class="text-sm text-gray-400 mb-2">
                                                <span>🗣️</span>
                                                <span x-text="rec.speaker"></span>
                                            </div>
                                            <!-- Reasoning -->
                                            <div x-show="rec.reasoning" class="mb-2">
                                                <div class="text-xs text-gray-500 mb-1">Motivering:</div>
                                                <p class="text-sm text-gray-300" x-text="rec.reasoning"></p>
                                            </div>
                                            <!-- Quote -->
                                            <div x-show="rec.quote" class="mb-2">
                                                <div class="text-xs text-gray-500 mb-1">Citat:</div>
                                                <p class="text-sm text-gray-400 italic border-l-2 border-gray-600 pl-3" x-text="rec.quote"></p>
                                            </div>
                                            <!-- Price target & time horizon -->
                                            <div x-show="rec.price_target || rec.time_horizon" class="flex space-x-4 text-sm text-gray-400">
                                                <span x-show="rec.price_target" x-text="'🎯 Kursmål: ' + rec.price_target"></span>
                                                <span x-show="rec.time_horizon" x-text="'⏱️ Tidshorisont: ' + rec.time_horizon"></span>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- Stocks Discussed -->
                        <div x-show="video.stocks_discussed.length > 0 && video.recommendations.length === 0" class="mt-3 pt-3 border-t border-gray-700">
                            <span class="text-xs text-gray-500">Stocks discussed: </span>
                            <span class="text-xs text-gray-400" x-text="video.stocks_discussed.slice(0, 10).join(', ')"></span>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Load More -->
            <button x-show="filteredYoutubeVideos.length > youtubeDisplayLimit"
                    @click="youtubeDisplayLimit += 50"
                    class="mt-6 w-full py-3 bg-gray-800 hover:bg-gray-700 rounded-lg text-sm transition-colors">
                Visa fler (<span x-text="filteredYoutubeVideos.length - youtubeDisplayLimit"></span> kvar)
            </button>

            <p x-show="filteredYoutubeVideos.length === 0" class="text-gray-500 text-center py-10">
                Inga videor matchar filtren
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-800 py-6 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm text-gray-500">
            <span>Generated: </span>
            <span x-text="metadata.generated_at ? new Date(metadata.generated_at).toLocaleString('sv-SE') : '-'"></span>
        </div>
    </footer>

    <script src="assets/app.js"></script>
</body>
</html>

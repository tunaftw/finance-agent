[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "podstock"
version = "0.1.0"
description = "Track stock recommendations from Swedish podcasts"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Pontus Skog"}
]
keywords = ["podcast", "stocks", "transcription", "whisper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "feedparser>=6.0.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "yt-dlp>=2024.12.0",
    "webvtt-py>=0.4.6",
    "yfinance>=0.2.0",
    "rapidfuzz>=3.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-requests",
]
transcribe = [
    "mlx-whisper>=0.1.0",
]
filings = [
    "edgartools>=3.0.0",
    "secfsdstools>=0.7.0",
    "pymupdf4llm>=0.0.10",
    "pdfplumber>=0.11.0",
    "anthropic>=0.40.0",
]

[project.scripts]
podstock = "podstock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["podstock"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = [
    "feedparser.*",
    "mlx_whisper.*",
    "yt_dlp.*",
    "webvtt.*",
    "yfinance.*",
    "rapidfuzz.*",
    "edgartools.*",
    "secfsdstools.*",
    "pymupdf4llm.*",
    "pdfplumber.*",
    "fitz.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/podstock"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
